stages:
  - build
  - deploy


build:gitlab:
  stage: build  
  tags:
    - npm
    - windows
  artifacts:
    paths:
    - .dist
  script:
    - Copy-Item -Path F:\jk\atk-doc\node_modules -Destination $PWD -Recurse
    - npm run build:gitlab

build:standalone:
  stage: build  
  tags:
    - npm
    - windows
  artifacts:
    paths:
    - .dist
  script:
    - Copy-Item -Path F:\jk\atk-doc\node_modules -Destination $PWD -Recurse
    - npm run build:standalone


deploy:pages:
  stage: deploy
  tags:
    - linux
    - gitlab
  dependencies:
    - build:gitlab
  script:
    - cp -r .dist/gitlab/* /mnt/project/gitlab/gitlab-rails/shared/pages/jinke18/atk-doc
